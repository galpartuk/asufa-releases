name: Publish
on:
  push:
    branches: [main]
# No paths filter: after a force-push of an unrelated commit GitHub has no diff and skips the run.
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r '.payload | fromjson | .version' update.json)
          gh release view "v$v" >/dev/null 2>&1 && exit 0
          gh release create "v$v" "Asufa-Setup-$v.exe" update.json --title "אסופה $v" --notes "" --latest
